spring:
  datasource:
    url: jdbc:mysql://localhost:3306/pr_review_agent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: your_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

github:
  api:
    token: your_github_token

model:
  api:
    base-url: https://api.openai.com/v1
    api-key: your_model_api_key
    model-name: gpt-4.1-mini
    timeout-seconds: 60
