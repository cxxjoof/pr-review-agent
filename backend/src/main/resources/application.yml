spring:
  application:
    name: pr-review-agent
  datasource:
    url: ${DB_URL:jdbc:h2:mem:pr_review_agent;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: ${JPA_DIALECT:org.hibernate.dialect.H2Dialect}

server:
  port: 8080

github:
  api:
    base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    token: ${GITHUB_TOKEN:}
    timeout-seconds: ${GITHUB_API_TIMEOUT_SECONDS:20}
    api-version: ${GITHUB_API_VERSION:2022-11-28}
